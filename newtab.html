<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Big+Shoulders+Display:wght@800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Background Video Layer (Hidden unless a video is uploaded) -->
  <video id="bg-video" class="bg-video hidden" autoplay loop muted playsinline></video>
  <div id="bg-overlay" class="bg-overlay hidden"></div>

  <main class="container">
    <!-- True Frosted Glass Clock (Pinned to Top) -->
    <div class="hyper-clock-wrapper">
      <div id="hyper-date" class="hyper-date">Sat, Oct 24</div>
      
      <div class="clock-glass-stage">
        <svg class="clock-svg" viewBox="0 0 520 210" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="glass-rim-grad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="rgba(255, 255, 255, 0.55)" />
              <stop offset="200%" stop-color="rgba(255, 255, 255, 0.36)" />
              <stop offset="100%" stop-color="rgba(255, 255, 255, 0.42)" />
            </linearGradient>

            <linearGradient id="glass-fill-grad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="rgba(255, 255, 255, 0.05)" />
              <stop offset="45%" stop-color="rgba(255, 255, 255, 0.06)" />
              <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
            </linearGradient>
          </defs>

          <!-- Split elements so the colon can be precisely centered vertically -->
          <text x="45%" y="84%" text-anchor="end" class="svg-clock-font svg-clock-rim" id="clock-hours">10</text>
          <text x="50%" y="74%" text-anchor="middle" class="svg-clock-font svg-clock-rim" id="clock-colon">:</text>
          <text x="54%" y="84%" text-anchor="start" class="svg-clock-font svg-clock-rim" id="clock-minutes">22</text>
        </svg>
      </div>
    </div>

    <!-- Frosted Search Bar -->
    <form class="glass-search-box" action="https://www.google.com/search" method="GET">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>

      <input 
        type="text" 
        name="q" 
        class="glass-input" 
        placeholder="Search Google or enter URL" 
        autocomplete="off" 
         
      />

    </form>

    <!-- Frosted Glass Shortcuts with Real Colored Icons -->
    <div class="shortcuts-grid">
      <a href="https://www.youtube.com" class="glass-tile" title="YouTube">
        <div class="tile-icon">
          <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=128" alt="YouTube" />
        </div>
        <span class="tile-title">YouTube</span>
      </a>

      <a href="https://gemini.google.com" class="glass-tile" title="Gemini">
        <div class="tile-icon">
          <img src="https://www.google.com/s2/favicons?domain=gemini.google.com&sz=128" alt="Gemini" />
        </div>
        <span class="tile-title">Gemini</span>
      </a>

      <a href="https://chatgpt.com" class="glass-tile" title="ChatGPT">
        <div class="tile-icon">
          <img src="https://www.google.com/s2/favicons?domain=chatgpt.com&sz=128" alt="ChatGPT" />
        </div>
        <span class="tile-title">ChatGPT</span>
      </a>

      <a href="https://web.whatsapp.com" class="glass-tile" title="WhatsApp">
        <div class="tile-icon">
          <img src="https://www.google.com/s2/favicons?domain=whatsapp.com&sz=128" alt="WhatsApp" />
        </div>
        <span class="tile-title">WhatsApp</span>
      </a>

      <a href="https://www.flipkart.com" class="glass-tile" title="Flipkart">
        <div class="tile-icon">
          <img src="https://www.google.com/s2/favicons?domain=flipkart.com&sz=128" alt="Flipkart" />
        </div>
        <span class="tile-title">Flipkart</span>
      </a>

      <a href="https://www.amazon.in" class="glass-tile" title="Amazon">
        <div class="tile-icon">
          <img src="https://www.google.com/s2/favicons?domain=amazon.in&sz=128" alt="Amazon" />
        </div>
        <span class="tile-title">Amazon</span>
      </a>

      <a href="https://music.apple.com" class="glass-tile" title="Apple Music">
        <div class="tile-icon">
          <img src="https://www.google.com/s2/favicons?domain=music.apple.com&sz=128" alt="Apple Music" />
        </div>
        <span class="tile-title">Apple Music</span>
      </a>
    </div>



  </main>


  </main>

  <!-- Bottom-Left Greeting Section -->
  <div class="bottom-section">
    <div class="greeting-block">
      <div id="greeting-text" class="greeting-text">Good Night</div>
      <div id="greeting-sub" class="greeting-sub">Cloudy night.</div>
    </div>
  </div>


  <!-- Bottom-Right Edit Icon & Glass Popover Menu -->
  <div class="bg-controls">
    <input type="file" id="photo-upload" accept="image/*" hidden />
    <input type="file" id="video-upload" accept="video/mp4,video/webm,video/ogg" hidden />

    <div id="bg-menu" class="glass-menu hidden">
      <label for="photo-upload" class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span>Upload Photo</span>
      </label>

      <label for="video-upload" class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        <span>Upload Video</span>
      </label>

      <button id="bg-reset-btn" class="menu-item reset-item hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18"></path>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        <span>Reset to Black</span>
      </button>
    </div>

    <button id="edit-bg-btn" class="glass-edit-btn" title="Customize Background">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"></path>
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
      </svg>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
